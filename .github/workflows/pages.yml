# Builds the static site from the committed wiki snapshot and deploys it to GitHub Pages.
# Releases are deliberate (Endings 5.1): run manually, or push to main.
# Tick "refresh" to re-fetch the Wikibooks source first; commit the new snapshot afterwards.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch the Wikibooks source before building"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            python3 -I build/build.py --refresh
          else
            python3 -I build/build.py
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
